<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <!-- El enlace trae un codigo de un solo uso: no se envia a otros sitios -->
  <meta name="referrer" content="no-referrer">
  <title>ClimaPulse</title>
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --teal: #2BC1AD;
      --amarillo: #FFD166;
      --navy: #17212F;
      --navy-profundo: #101823;
      --superficie: #1C2838;
      --borde: #2C3B4E;
      --texto: #EEF2F7;
      --texto-suave: #B9C6D6;
      --error: #F2B8B5;
      --error-fondo: #4A1C1A;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: var(--navy-profundo);
      color: var(--texto);
      font-family: "Poppins", system-ui, sans-serif;
    }
    main {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }
    .logo { width: 88px; height: 88px; margin: 0 auto 28px; display: block; }
    .anillos {
      width: 160px; height: 160px; margin: 0 auto 24px;
      border-radius: 50%;
      display: grid; place-items: center;
      background: radial-gradient(circle, rgba(43,193,173,.18) 0 38%, rgba(43,193,173,.08) 39% 58%, transparent 59%);
      box-shadow: 0 0 0 1px rgba(43,193,173,.15) inset;
    }
    .anillos svg { width: 56px; height: 56px; }
    h1 { font-size: 1.6rem; font-weight: 600; margin: 0 0 12px; }
    p { color: var(--texto-suave); line-height: 1.6; margin: 0 0 20px; }
    strong { color: var(--texto); font-weight: 500; overflow-wrap: anywhere; }
    form { text-align: left; margin-top: 8px; }
    label { display: block; font-size: .9rem; color: var(--texto-suave); margin: 0 0 6px 4px; }
    input {
      width: 100%;
      padding: 16px 18px;
      margin-bottom: 16px;
      border-radius: 16px;
      border: 1px solid var(--borde);
      background: var(--superficie);
      color: var(--texto);
      font: inherit;
      font-size: 1rem;
    }
    input:focus { outline: 2px solid var(--teal); outline-offset: 1px; border-color: transparent; }
    button {
      width: 100%;
      padding: 18px;
      border: 0;
      border-radius: 999px;
      background: var(--teal);
      color: var(--navy);
      font: inherit;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: progress; }
    .error {
      background: var(--error-fondo);
      color: var(--error);
      border-radius: 16px;
      padding: 14px 16px;
      margin: 0 0 16px;
      text-align: left;
      font-size: .95rem;
    }
    .pie { margin-top: 32px; font-size: .8rem; color: #6F7E91; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <svg class="logo" viewBox="0 0 72 72" aria-hidden="true">
      <circle cx="36" cy="36" r="36" fill="#2BC1AD"/>
      <circle cx="36" cy="36" r="27" fill="#17212F"/>
      <circle cx="36" cy="36" r="16" fill="#FFD166"/>
      <circle cx="36" cy="36" r="9" fill="#FFFFFF"/>
    </svg>

    <!-- Mientras se revisa el enlace -->
    <section id="cargando">
      <h1>Un momento…</h1>
      <p>Estamos revisando tu enlace.</p>
    </section>

    <!-- Resultado final (éxito o error) -->
    <section id="resultado" hidden>
      <div class="anillos" id="icono"></div>
      <h1 id="titulo"></h1>
      <p id="mensaje"></p>
    </section>

    <!-- Formulario para crear una nueva contraseña -->
    <section id="nueva-clave" hidden>
      <h1>Crea una nueva contraseña</h1>
      <p>Para la cuenta <strong id="correo"></strong></p>
      <form id="formulario" novalidate>
        <div class="error" id="error-clave" role="alert" hidden></div>
        <label for="clave">Nueva contraseña</label>
        <input id="clave" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
        <label for="clave2">Repite la contraseña</label>
        <input id="clave2" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
        <button id="guardar" type="submit">Guardar contraseña</button>
      </form>
    </section>

    <p class="pie">ClimaPulse · Monitoreo de ambiente</p>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";
    import {
      getAuth, applyActionCode, checkActionCode, verifyPasswordResetCode, confirmPasswordReset
    } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js";

    // La API key de Firebase es pública (identifica el proyecto, no da acceso por sí sola).
    // Se usa la que trae el enlace y esta solo si el enlace llegó sin ella.
    const API_KEY_PROYECTO = "AIzaSyAQx-tvfpOn3az0M_BOnyUiNw-tAA8BGK8";

    const ICONO_OK = '<svg viewBox="0 0 24 24" fill="#2BC1AD"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>';
    const ICONO_ERROR = '<svg viewBox="0 0 24 24" fill="#FFD166"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg>';

    // Algunos correos (o sus filtros de seguridad) reescriben el enlace y cambian "&" por "&amp;".
    // Se repara antes de leerlo, para que el enlace funcione igual.
    function leerEnlace() {
      const reparado = (location.search + "&" + location.hash.replace(/^#/, ""))
        .replace(/&amp;/gi, "&")
        .replace(/^\?/, "");
      const p = new URLSearchParams(reparado);
      return {
        modo: p.get("mode"),
        codigo: p.get("oobCode"),
        apiKey: p.get("apiKey") || API_KEY_PROYECTO
      };
    }

    function mostrar(id) {
      for (const s of ["cargando", "resultado", "nueva-clave"]) {
        document.getElementById(s).hidden = s !== id;
      }
    }

    function resultado(ok, titulo, mensaje) {
      document.getElementById("icono").innerHTML = ok ? ICONO_OK : ICONO_ERROR;
      document.getElementById("titulo").textContent = titulo;
      document.getElementById("mensaje").textContent = mensaje;
      mostrar("resultado");
    }

    function errorDeEnlace(e) {
      const vencido = e && (e.code === "auth/expired-action-code" || e.code === "auth/invalid-action-code");
      resultado(false,
        vencido ? "Este enlace ya no sirve" : "No pudimos abrir el enlace",
        vencido
          ? "Ya se usó o venció. Pide uno nuevo desde la app de ClimaPulse."
          : "Revisa tu conexión a internet e intenta abrirlo de nuevo. Si sigue fallando, pide un enlace nuevo desde la app.");
    }

    // Misma regla de contraseñas que la app.
    const COMUNES = new Set(["12345678", "123456789", "1234567890", "87654321", "password", "password1",
      "contraseña", "qwertyui", "qwerty123", "abcd1234", "abc12345", "iloveyou", "11223344", "climapulse"]);
    function validarClave(clave) {
      if (clave.length < 8) return "Usa al menos 8 caracteres.";
      if (clave.length > 128) return "Usa como máximo 128 caracteres.";
      if (new Set(clave).size < 3) return "Evita repetir el mismo carácter.";
      if (COMUNES.has(clave.toLowerCase())) return "Esa contraseña es muy común, elige otra.";
      return null;
    }

    const { modo, codigo, apiKey } = leerEnlace();
    const auth = getAuth(initializeApp({ apiKey }));
    auth.languageCode = "es";

    if (!codigo) {
      resultado(false, "El enlace está incompleto",
        "Puede que tu correo lo haya cortado. Ábrelo directo desde el correo o pide uno nuevo desde la app.");
    } else if (modo === "verifyEmail") {
      try {
        await applyActionCode(auth, codigo);
        resultado(true, "¡Correo verificado!",
          "Tu cuenta ya está activa. Vuelve a ClimaPulse y toca «Ya lo verifiqué».");
      } catch (e) {
        errorDeEnlace(e);
      }
    } else if (modo === "resetPassword") {
      try {
        const correo = await verifyPasswordResetCode(auth, codigo);
        document.getElementById("correo").textContent = correo;
        mostrar("nueva-clave");
      } catch (e) {
        errorDeEnlace(e);
      }
    } else if (modo === "recoverEmail") {
      try {
        const info = await checkActionCode(auth, codigo);
        await applyActionCode(auth, codigo);
        resultado(true, "Recuperamos tu correo",
          `Tu cuenta vuelve a usar ${info.data.email}. Si no pediste el cambio, crea una nueva contraseña desde la app.`);
      } catch (e) {
        errorDeEnlace(e);
      }
    } else {
      resultado(false, "El enlace está incompleto",
        "Puede que tu correo lo haya cortado. Ábrelo directo desde el correo o pide uno nuevo desde la app.");
    }

    document.getElementById("formulario").addEventListener("submit", async (evento) => {
      evento.preventDefault();
      const clave = document.getElementById("clave").value;
      const clave2 = document.getElementById("clave2").value;
      const caja = document.getElementById("error-clave");
      const problema = validarClave(clave) || (clave !== clave2 ? "Las contraseñas no coinciden." : null);
      caja.textContent = problema || "";
      caja.hidden = !problema;
      if (problema) return;

      const boton = document.getElementById("guardar");
      boton.disabled = true;
      boton.textContent = "Guardando…";
      try {
        await confirmPasswordReset(auth, codigo, clave);
        resultado(true, "Contraseña actualizada", "Ya puedes ingresar a ClimaPulse con tu nueva contraseña.");
      } catch (e) {
        if (e.code === "auth/weak-password") {
          caja.textContent = "La contraseña es muy débil. Usa al menos 8 caracteres.";
          caja.hidden = false;
        } else {
          errorDeEnlace(e);
        }
      } finally {
        boton.disabled = false;
        boton.textContent = "Guardar contraseña";
      }
    });
  </script>
</body>
</html>
